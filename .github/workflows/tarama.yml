name: Borsa Sinyal Otomasyonu

on:
  schedule:
    # Hafta içi (Pazartesi-Cuma) günde 3 kez (Örn: 09:30, 13:30, 18:00 TR saati karşılığı UTC)
    - cron: '30 6,10,15 * * 1-5'
    
    # Hafta sonu (Cumartesi-Pazar) sadece kripto/aktif piyasalar için günde 2 kez
    - cron: '0 9,18 * * 6,7'
    
  workflow_dispatch: # Elle tetiklemek için

jobs:
  tarama_calistir:
    runs-on: ubuntu-latest

    steps:
    - name: Kodlari Indir
      uses: actions/checkout@v4

    - name: Python Kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Bagimliliklari Yukle
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Tarama Motorunu Baslat
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python tarama_motoru.py